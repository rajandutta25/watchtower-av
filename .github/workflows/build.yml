# Builds the Windows installer on GitHub's free Windows runners.
# Push to GitHub -> Actions tab -> download "WatchtowerAV-Setup" artifact.
# Push a tag like v0.1.0 -> installer is attached to a GitHub Release automatically.
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Run tests
        run: python -m pytest -q tests

      - name: Build executables
        shell: cmd
        run: |
          set COMMON=--noconfirm --onefile --clean --add-data "rules;rules" --add-data "assets;assets" --icon assets\watchtower.ico --collect-submodules watchdog --version-file installer\version_info.txt
          python -m PyInstaller %COMMON% --windowed --name WatchtowerAV launcher_gui.py || exit /b 1
          python -m PyInstaller %COMMON% --console  --name watchtower   launcher_cli.py || exit /b 1

      - name: Smoke-test the frozen CLI (no Python on PATH needed)
        shell: pwsh
        run: |
          $env:WATCHTOWER_HOME = "$env:RUNNER_TEMP\kh"
          .\dist\watchtower.exe info
          $t = "$env:RUNNER_TEMP\t"; New-Item -ItemType Directory $t | Out-Null
          Set-Content "$t\ok.txt" "hello"
          .\dist\watchtower.exe scan $t
          if ($LASTEXITCODE -ne 0) { throw "false positive on clean folder" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $ver = if ($env:GITHUB_REF -like "refs/tags/v*") { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.1.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\WatchtowerAV.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Test silent install / uninstall
        timeout-minutes: 5
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\WatchtowerAV-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /TASKS=desktopicon" -Wait
          & "${env:ProgramFiles}\Watchtower AV\watchtower.exe" info
          if ($LASTEXITCODE -ne 0) { throw "installed CLI failed" }
          Start-Process "${env:ProgramFiles}\Watchtower AV\unins000.exe" -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          Start-Sleep 5
          if (Test-Path "${env:ProgramFiles}\Watchtower AV\watchtower.exe") { throw "uninstall left files behind" }

      - uses: actions/upload-artifact@v4
        with:
          name: WatchtowerAV-Setup
          path: |
            dist/WatchtowerAV-Setup-*.exe
            dist/watchtower.exe
            dist/WatchtowerAV.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/WatchtowerAV-Setup-*.exe
          generate_release_notes: true
